name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  regression-checks:
    name: Backend, database, and frontend regression checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: secondopinion_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: secondopinion_examples_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secondopinion_test -d secondopinion_examples_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://secondopinion_test:local-ci-only@localhost:5432/secondopinion_examples_test
      TEST_CACHE_DATABASE_URL: postgresql://secondopinion_test:local-ci-only@localhost:5432/secondopinion_cache_test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Create disposable cache database
        run: |
          python - <<'PY'
          import os
          import psycopg
          with psycopg.connect(os.environ["TEST_DATABASE_URL"], autocommit=True) as connection:
              connection.execute("CREATE DATABASE secondopinion_cache_test")
          PY
      - name: Backend tests including PostgreSQL
        working-directory: backend
        run: python -m pytest -q
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend tests and production build
        working-directory: frontend
        run: npm test && npm run build
  sonarqube:
    name: SonarQube
    # GitHub withholds SONAR_TOKEN from pull requests opened from forks, so the scan
    # can only fail there. Fork changes are scanned on the push to main after merge.
    # Do not switch to pull_request_target: it would run fork code with the token.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
